<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hamidullah Bibliometric Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2733;--mut:#677384;--line:#e3ddd0;--pre:#1B3A5C;--post:#B8860B;--acc:#1B3A5C;--hi:#fdf3d6;--chip:#eef2f7;--shadow:0 1px 2px rgba(20,30,40,.06),0 4px 14px rgba(20,30,40,.05)}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--card:#18212b;--ink:#e7ecf1;--mut:#9aa7b5;--line:#2a3541;--pre:#6fa3d8;--post:#e2b14c;--acc:#6fa3d8;--hi:#3a3220;--chip:#223040;--shadow:none}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Naskh Arabic','Jameel Noori Nastaleeq','Inter',system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;line-height:1.7}
html[dir=ltr] body{font-family:'Inter',system-ui,'Segoe UI',sans-serif;line-height:1.5}
.num,.val,.kpi b,svg text,table td.n{font-family:'Inter',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
h1{font-size:1.45rem;margin:0;line-height:1.5;color:var(--acc)}
header p{margin:2px 0 0;color:var(--mut);font-size:.92rem}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:4px 14px;font-size:.88rem}
.btn:hover{border-color:var(--acc)}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--ink);padding:4px 14px;font-size:.9rem}
.seg button.on{background:var(--acc);color:#fff}
.seg button.pre.on{background:var(--pre)}.seg button.post.on{background:var(--post)}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px;margin-inline-start:10px;vertical-align:middle}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.82rem;color:var(--ink)}
.chip:after{content:" ×";color:var(--mut)}
.count{margin-inline-start:10px;color:var(--mut);font-size:.88rem}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.7rem;line-height:1.2;color:var(--acc)}
.kpi b,.stat b{unicode-bidi:isolate;direction:ltr;white-space:nowrap}.kpi b{font-size:1.5rem!important}html[dir=rtl] .kpi b,html[dir=rtl] .stat b{text-align:right}.stat b{white-space:nowrap}
.kpi span{font-size:.84rem;color:var(--mut)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
nav.tabs button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:10px;font-size:.92rem}
nav.tabs button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
section.tab{display:none}section.tab.on{display:block}
.grid{display:grid;gap:14px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);grid-column:span 12;min-width:0}
.card.h6{grid-column:span 6}.card.h4{grid-column:span 4}.card.h8{grid-column:span 8}
@media(max-width:860px){.card.h6,.card.h4,.card.h8{grid-column:span 12}}
.card h2{font-size:1.02rem;margin:0 0 2px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card h2 small{font-weight:400;color:var(--mut);font-size:.76rem;white-space:nowrap}
.note{color:var(--mut);font-size:.84rem;margin:0 0 8px}
.insight{margin:8px 0 0;font-size:.88rem;color:var(--ink);background:var(--hi);border-radius:10px;padding:6px 10px}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--mut);margin:2px 0 6px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px}
.pre-c{background:var(--pre)}.post-c{background:var(--post)}
.hb{display:flex;flex-direction:column;gap:3px}
.hb .row{display:grid;grid-template-columns:minmax(90px,38%) 1fr 44px;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);padding:2px 4px;border-radius:8px;text-align:start;width:100%}
.hb .row:hover{background:var(--chip)}
.hb .row.sel{background:var(--hi);outline:1px solid var(--post)}
.hb.dim .row:not(.sel){opacity:.55}
.hb .lab{font-size:.86rem;line-height:1.35;overflow:hidden;text-overflow:ellipsis}
.hb .track{height:15px;background:var(--chip);border-radius:6px;overflow:hidden;display:flex}
.hb .track i{display:block;height:100%}
.hb .val{font-size:.82rem;text-align:end;color:var(--mut)}
svg{display:block;width:100%;height:auto;direction:ltr}
svg text{fill:var(--mut);font-size:11px}
.tt{position:fixed;z-index:50;pointer-events:none;background:#111c;color:#fff;backdrop-filter:blur(4px);padding:5px 10px;border-radius:8px;font-size:.82rem;display:none;max-width:260px;direction:inherit}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.n{text-align:end}
.heat td{text-align:center;padding:0}
.heat td button{width:100%;min-width:42px;height:34px;border:1px solid transparent;border-radius:6px;font-size:.78rem;color:var(--ink);background:transparent}
.heat td button.sel{outline:2px solid var(--post)}
.heat th{white-space:nowrap;font-size:.78rem}
.ind{display:grid;grid-template-columns:minmax(110px,26%) 1fr 70px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.ind .bars{display:flex;flex-direction:column;gap:3px}
.ind .bars div{height:12px;border-radius:5px;position:relative}
.ind .bars span{position:absolute;inset-inline-start:6px;top:-3px;font-size:.74rem;color:#fff;font-family:Inter,sans-serif}
.ind .x{font-family:Inter,sans-serif;font-weight:700;color:var(--post);text-align:end}
.fcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.fc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}
.fc .k{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--acc);color:#fff;font-family:Inter,sans-serif;font-size:.82rem;align-items:center;justify-content:center;margin-inline-end:8px}
.fc h3{font-size:1rem;margin:0 0 6px;display:flex;align-items:center;color:var(--acc)}
.fc p{margin:0 0 10px;font-size:.9rem}
.stat{display:flex;gap:14px;flex-wrap:wrap}
.stat div{flex:1;min-width:120px;background:var(--chip);border-radius:12px;padding:8px 12px}
.stat b{font-family:Inter,sans-serif;font-size:1.35rem;display:block}
.stat span{font-size:.8rem;color:var(--mut)}
.search{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.search input{flex:1;min-width:180px;font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:5px 10px}
.pager{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:10px;font-size:.86rem}
footer{margin:22px 0 8px;color:var(--mut);font-size:.8rem;border-top:1px solid var(--line);padding-top:10px}
.brush{cursor:crosshair}
@media print{
 body{background:#fff;color:#000}.bar,nav.tabs,.tools,.search,.pager,.no-print{display:none!important}
 section.tab{display:block!important;page-break-inside:avoid}.card,.fc,.kpi{box-shadow:none;break-inside:avoid}
}
</style>
</head>

 var rs=F('ab'),cnt={};rs.forEach(function(r){if(r.a!=null)cnt[r.a]=(cnt[r.a]||0)+1});
 var A0=16,A1=83,W=900,H=260,m={l:34,r:10,t:16,b:28},iw=W-m.l-m.r,ih=H-m.t-m.b;
 var mx=0;for(var a=A0;a<=A1;a++)mx=Math.max(mx,cnt[a]||0);var yt=Math.max(10,Math.ceil(mx/10)*10);
 var s=svg(W,H),X=function(a){return m.l+(a-A0)/(A1-A0)*iw},Yp=function(v){return m.t+ih-v/yt*ih};
 for(var g=0;g<=4;g++){var v=yt/4*g;sv(s,'line',{x1:m.l,x2:W-m.r,y1:Yp(v),y2:Yp(v),stroke:cssv('--line')});sv(s,'text',{x:m.l-5,y:Yp(v)+4,'text-anchor':'end'},Math.round(v))}
 for(a=20;a<=80;a+=10)sv(s,'text',{x:X(a),y:H-8,'text-anchor':'middle'},a);
 var pts=[];for(a=A0;a<=A1;a++)pts.push([X(a),Yp(cnt[a]||0)]);
 var d='M'+pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1)}).join(' L');
 sv(s,'path',{d:d+' L'+X(A1)+','+Yp(0)+' L'+X(A0)+','+Yp(0)+' Z',fill:cssv('--post'),opacity:.22});
 sv(s,'path',{d:d,fill:'none',stroke:cssv('--post'),'stroke-width':2.2});
 var best=A0;for(a=A0;a<=A1;a++)if((cnt[a]||0)>(cnt[best]||0))best=a;
 if(cnt[best]){sv(s,'circle',{cx:X(best),cy:Yp(cnt[best]),r:5,fill:cssv('--pre')});sv(s,'text',{x:X(best),y:Yp(cnt[best])-9,'text-anchor':'middle','style':'fill:'+cssv('--ink')+';font-weight:600'},best)}
 var ov=sv(s,'rect',{x:m.l,y:m.t,width:iw,height:ih,fill:'transparent'});
 ov.addEventListener('pointermove',function(e){var p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;var q=p.matrixTransform(s.getScreenCTM().inverse());var ag=Math.max(A0,Math.min(A1,Math.round((q.x-m.l)/iw*(A1-A0)+A0)));tip(e,'<b class="num">'+ag+'</b> '+t('fmt_age')+' · '+fmt(cnt[ag]||0)+' '+t('entries'))});
 ov.addEventListener('pointerleave',untip);
 box.appendChild(s);
 var e=$('i_agec'),tot=0;for(a=A0;a<=A1;a++)tot+=cnt[a]||0;
 if(tot){var s60=0;for(a=60;a<=A1;a++)s60+=cnt[a]||0;e.innerHTML=t('peak')+': '+B(best)+' '+t('fmt_age')+' ('+B(cnt[best]||0)+') · '+B('60+')+': '+B(fmt(s60)+' ('+pct(s60,tot)+')');e.style.display=''}else e.style.display='none';
 figtag('agec',5);
}

  top2.forEach(function(x){x.label=D.jo[x.id]});hbar('jour',top2,'j');topNote('jour',top2,rs.filter(function(r){return r.j>=0}).length);legend('lg8');figtag('jour',6);
  var tot=all.reduce(function(a,x){return a+x.n},0),t10=all.slice(0,10).reduce(function(a,x){return a+x.n},0),one=all.filter(function(x){return x.n===1}).length;
  $('conc').innerHTML='<div><b>'+pct(t10,tot)+'</b><span>'+t('conc_top10')+' ('+fmt(t10)+')</span></div><div><b>'+fmt(one)+'</b><span>'+t('conc_one')+'</span></div><div><b>'+fmt(all.length)+'</b><span>'+t('conc_tot')+'</span></div><div><b>'+fmt(rs.length-tot)+'</b><span>'+t('nojour')+'</span></div>'}
 if(tab==='fin')renderFindings();
 if(tab==='ent')renderTable();
 ['annual','decade','ind','agec','ageb','lang','type','country','heat','hyd','subj','kw','jour','conc'].forEach(function(k){var a=$('t_'+k),b=$('n_'+k);if(a)a.textContent=t('t_'+k);if(b)b.textContent=t('n_'+k)});

function renderHeat(){
 var rs=F('c');var rs2=rs.filter(function(r){return S.g==null||r.g===S.g});
 var rr=F('c');var rowsAll=F('g');var cm={};rowsAll.forEach(function(r){if(r.c>=0)cm[r.c]=(cm[r.c]||0)+1});
 var cs=Object.keys(cm).map(Number).sort(function(a,b){return cm[b]-cm[a]}).slice(0,8);
 var base=rows.filter(function(r){return pass(r,'c')&&pass(r,'g')});
 var cells={},mx=1;base.forEach(function(r){if(r.c<0||r.g<0)return;var k=r.c+'_'+r.g;cells[k]=(cells[k]||0)+1});
 var cs2=Object.keys(cells).map(function(k){var p=k.split('_');return[+p[0],+p[1],cells[k]]});
 var ctot={};cs2.forEach(function(x){ctot[x[0]]=(ctot[x[0]]||0)+x[2]});
 cs=Object.keys(ctot).map(Number).sort(function(a,b){return ctot[b]-ctot[a]}).slice(0,8);
 if(S.c!=null&&cs.indexOf(S.c)<0)cs.push(S.c);
 cs2.forEach(function(x){if(cs.indexOf(x[0])>=0)mx=Math.max(mx,x[2])});
 var h='<table class="heat"><tr><th></th>'+LG.map(function(g){return'<th>'+lb(L.lang,g)+'</th>'}).join('')+'</tr>';
 cs.forEach(function(c){h+='<tr><th>'+lb(L.co,c)+'</th>';LG.forEach(function(g){var n=cells[c+'_'+g]||0;var a=n?Math.min(1,.12+n/mx*.88):0;var sel=S.c===c&&S.g===g;
  h+='<td><button type="button" data-c="'+c+'" data-g="'+g+'" class="'+(sel?'sel':'')+'" style="background:'+(n?'rgba(184,134,11,'+a.toFixed(2)+')':'transparent')+';color:'+(a>.55?'#fff':'inherit')+'">'+(n||'')+'</button></td>'});h+='</tr>'});
 h+='</table>';$('heat').innerHTML=h;
 var bs=$('heat').querySelectorAll('button');for(var i=0;i<bs.length;i++)(function(b){b.onclick=function(){var c=+b.getAttribute('data-c'),g=+b.getAttribute('data-g');if(S.c===c&&S.g===g){S.c=null;S.g=null}else{S.c=c;S.g=g}renderAll()};
  b.onmousemove=function(e){var n=b.textContent;if(n)tip(e,'<b>'+lb(L.co,+b.getAttribute('data-c'))+' × '+lb(L.lang,+b.getAttribute('data-g'))+'</b><br><span class="num">'+n+'</span>')};b.onmouseleave=untip})(bs[i]);
 var e=$('i_heat'),best=cs2.slice().sort(function(a,b){return b[2]-a[2]})[0];
 if(best){var tc=ctot[best[0]];e.innerHTML=lb(L.co,best[0])+' · '+lb(L.lang,best[1])+': '+B(fmt(best[2])+' / '+fmt(tc)+' ('+pct(best[2],tc)+')');e.style.display=''}else e.style.display='none';
 figtag('heat',null);
}

 var ya=a.filter(function(r){return r.h===1}).length,yb=b.filter(function(r){return r.h===1}).length;

/* ---------- table ---------- */
var page=0,PS=20,qtxt='';
function tableRows(){var rs=F().slice().sort(function(a,b){return (a.y||9999)-(b.y||9999)||a.i-b.i});
 if(qtxt){var q=qtxt.toLowerCase();rs=rs.filter(function(r){return (r.ti+' '+(r.j>=0?D.jo[r.j]:'')).toLowerCase().indexOf(q)>=0})}return rs}
function renderTable(){
 var rs=tableRows(),np=Math.max(1,Math.ceil(rs.length/PS));if(page>=np)page=np-1;
 var h='<tr>'+t('th').map(function(x){return'<th>'+x+'</th>'}).join('')+'</tr>';
 rs.slice(page*PS,page*PS+PS).forEach(function(r){h+='<tr><td class="n">'+(r.y||'–')+'</td><td dir="ltr" style="text-align:start">'+esc(r.ti)+'</td><td>'+(r.g>=0?lb(L.lang,r.g):'–')+'</td><td>'+(r.t>=0?lb(L.type,r.t):'–')+'</td><td dir="ltr" style="text-align:start">'+(r.j>=0?esc(D.jo[r.j]):'–')+'</td><td>'+(r.c>=0?lb(L.co,r.c):'–')+'</td><td>'+(r.s>=0?lb(L.su,r.s):'–')+'</td></tr>'});
 $('tbl').innerHTML=h;
 var p=$('pager');p.innerHTML='';var a=el('button',{'class':'btn'},t('prev')),b=el('button',{'class':'btn'},t('next'));
 a.disabled=page===0;b.disabled=page>=np-1;a.onclick=function(){page--;renderTable()};b.onclick=function(){page++;renderTable()};
 var m=el('span',{'class':'num'},t('page')+' '+(page+1)+' / '+np+' · '+fmt(rs.length));
 if(ui==='ur'){p.appendChild(b);p.appendChild(m);p.appendChild(a)}else{p.appendChild(a);p.appendChild(m);p.appendChild(b)}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function csv(){
 var rs=tableRows(),out=['year,title,language,type,journal,country,subject,exile_era'];
 function q(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'}
 rs.forEach(function(r){out.push([r.y||'',q(r.ti),r.g>=0?L.lang[r.g][1]:'',r.t>=0?L.type[r.t][1]:'',q(r.j>=0?D.jo[r.j]:''),r.c>=0?D.co[r.c]:'',r.s>=0?D.su[r.s]:'',r.e===0?'pre':r.e===1?'post':'undated'].join(','))});
 try{var bl=new Blob(['﻿'+out.join('\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(bl),a=document.createElement('a');a.href=u;a.download='hamidullah_entries.csv';document.body.appendChild(a);a.click();document.body.removeChild(a)}catch(e){}
}
